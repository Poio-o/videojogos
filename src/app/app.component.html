<div style="padding: 20px; font-family: sans-serif;">
  <h1>Catálogo de Videojuegos</h1>

  <div style="display: flex; flex-wrap: wrap; gap: 16px;">
    <span>Buscar videojuego por ID: </span>
    <input #myInput type="text">
    <button (click)="buscarId(+myInput.value)">Buscar</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 16px;">
    <span>Buscar videojuego por Género: </span>
    <select (change)="onGenreChange($event)">
      <option value="">Todos</option>
      <option value="Action">Action</option>
      <option value="Adventure">Adventure</option>
      <option value="RPG">RPG</option>
      <option value="Racing">Racing</option>
      <option value="Simulation">Simulation</option>
      <option value="Sports">Sports</option>
      <option value="Strategy">Strategy</option>
    </select>
    <button (click)="buscarId(+myInput.value)">Buscar</button>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 16px;">
    @for (game of games; track game.title) {
    <div style="border: 1px solid #ccc; padding: 16px; border-radius: 8px; width: 200px;">
      <h3>{{ game.title }}</h3>
      <p><strong>Género:</strong> {{ game.genre }}</p>
      <p><strong>Plataforma:</strong> {{ game.platform }}</p>
      <p><strong>Precio:</strong> {{ game.price }}</p>
    </div>
    } @empty {
    <p>Cargando...</p>
    }
  </div>
</div>
